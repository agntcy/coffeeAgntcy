services:
  dir-api-server:
    image: ghcr.io/agntcy/dir-apiserver:v1.8.0@sha256:6b49d53c22e049b16d25d588b1f022c92cf573872f19ae55636d52252eb5522e
    env_file:
      - path: ./configs/dir/apiserver.env
        required: true
    ports:
      - 8888:8888
    depends_on:
      postgres:
        condition: service_healthy
      zot:
        condition: service_started
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "/bin/grpc-health-probe", "-addr=127.0.0.1:8888"]
      interval: 10s
      retries: 60
      start_period: 60s

  dir-mcp-server:
    image: ghcr.io/agntcy/dir-ctl:v1.8.0@sha256:a6cd66961f89ee0b4cc768996b6f621d6424a7059c8571c8faa2489c55218c4e
    container_name: dir-mcp-server
    stdin_open: true
    tty: true
    command: ["mcp", "serve"]
    environment:
      OASF_API_VALIDATION_SCHEMA_URL: https://schema.oasf.outshift.com
      DIRECTORY_CLIENT_SERVER_ADDRESS: dir-api-server:8888
      DIRECTORY_CLIENT_TLS_SKIP_VERIFY: "true"
    depends_on:
      dir-api-server:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:16.6-bookworm@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: directory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d directory"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  zot:
    image: ghcr.io/project-zot/zot:v2.1.15@sha256:376cb38a335bab89571af306eff481547212746aff11828043c22f32637fe17b
    ports:
      - 5555:5000
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    # # No healthcheck: production image is distroless and does not have wget/curl/nc or shells.
    # # Note: Zot has a /readyz endpoint (Kubernetes compliant API) since v2.1.6 that can be used for healthchecks.
    # # Notes for /readyz: https://zotregistry.dev/v2.1.14/general/whats-new/#v216 and https://kubernetes.io/docs/reference/using-api/health-checks/
    # healthcheck:
    #   test: curl -f http://localhost:5000/v2/ || exit 1
    #   interval: 5s
    #   retries: 60
    #   start_period: 15s

  recruiter-agent:
    build:
      context: ../../../..
      dockerfile: docker/Dockerfile.python-agent
      target: agent-with-dirctl
      args:
        PROJECT_PATH: coffeeAGNTCY/coffee_agents/recruiter
        UV_CACHE_ID: recruiter
        AGENT_SCRIPT: src/agent_recruiter/server/server.py
        APP_NAME: recruiter
    container_name: recruiter-agent
    ports:
      - "8881:8881"
    env_file:
      - path: ../.env
        required: false
    environment:
      - ENABLE_HTTP=true
      - MCP_CONNECTION_MODE=binary
      - DIRECTORY_CLIENT_SERVER_ADDRESS=dir-api-server:8888
      - DIRECTORY_CLIENT_TLS_SKIP_VERIFY=true
      - OASF_API_VALIDATION_SCHEMA_URL=https://schema.oasf.outshift.com
    depends_on:
      - dir-api-server
    healthcheck:
      test: curl -f http://localhost:8881/.well-known/agent.json || exit 1
      interval: 10s
      retries: 30
      start_period: 30s
