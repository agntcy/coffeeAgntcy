[project]
name = "agent-recruiter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "a2a-sdk==0.3.20",
    "mcp==1.30.0",
    "loguru==0.7.3",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "litellm==1.88.6",
    "langchain-litellm==0.3.5",
    "langchain-anthropic==1.7.1",
    "langchain-google-genai==4.4.0",
    "langchain-openai==1.2.2",
    "agntcy-app-sdk==0.5.5",
    "slim-bindings==1.1.0",
    "google-adk==2.8.0",
    "rogue-ai-sdk==0.6.4",
    "pydantic-yaml==1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-repeat==0.9.4",
    "ruff==0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://buf.build/gen/python"

[tool.uv]
exclude-newer = "14 days"
constraint-dependencies = [
    "starlette>=1.3.1",
]
# spiffe==0.3.1 (latest) caps pyjwt[crypto]<2.14, which blocks several PyJWT
# CVE fixes (notably CVE-2026-102268, a critical asymmetric-key confusion
# bypass). Forced past that cap; see tests/unit/test_spiffe_jwt_compat.py for
# the compatibility contract this relies on.
override-dependencies = ["pyjwt[crypto]==2.15.1"]

[tool.uv.exclude-newer-package]
pyjwt = "2026-10-01T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_recruiter"]

[tool.pytest.ini_options]
addopts = "--asyncio-mode=auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
filterwarnings = [
    "error",
    # google-adk runners.py:1481 reads RunConfig.save_input_blobs_as_artifacts (deprecated).
    # Warning attributed to google.adk.runners. Remove when ADK stops using it.
    "ignore:deprecated:DeprecationWarning:google.adk.runners",
    # google-adk mcp_toolset.py:181 still uses MCPTool (deprecated); should use McpTool. Remove when ADK is updated.
    "ignore:MCPTool class is deprecated:DeprecationWarning:google.adk.tools.mcp_tool.mcp_tool",
    # google-adk 2.8.0's own llm_agent_config.py still subclasses the deprecated BaseAgentConfig
    # internally (config is now loaded via reflection instead). Triggered merely by importing
    # google.adk.agents.Agent; warning is attributed to frozen abc internals, not a real module,
    # so no module filter is specified here. Remove when ADK stops subclassing it.
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    # google-adk emits experimental-feature notices (PLUGGABLE_AUTH, JSON_SCHEMA_FOR_FUNC_DECL, ...).
    "ignore:.*FeatureName.* is enabled:UserWarning",
    # a2a-sdk's starlette app references a deprecated HTTP status alias. Remove when a2a-sdk updates.
    # Starlette 1.6.0 raises this as its own StarletteDeprecationWarning (a UserWarning subclass,
    # not a DeprecationWarning), so the category below was updated accordingly.
    "ignore:'HTTP_413_REQUEST_ENTITY_TOO_LARGE' is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    # litellm's async logging coroutine is GC'd unawaited under the test event loop.
    "ignore:.*async_success_handler:pytest.PytestUnraisableExceptionWarning",
]
testpaths = ["tests"]

[tool.ruff]
indent-width = 4
target-version = "py312"

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
# Indentation only (issue #747). Broader Ruff rules can land in a later PR.
# W191/E101 ban tabs and mixed indent; E111/E114/E117 enforce the 4-space width.
# E111/E114/E117 are preview-only, so preview is scoped to the linter here and
# does not affect `ruff format` output.
preview = true
select = ["W191", "E101", "E111", "E114", "E117"]

[dependency-groups]
dev = ["pytest-asyncio>=1.3.0"]
