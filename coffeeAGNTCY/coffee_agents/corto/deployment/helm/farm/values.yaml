# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: corto-farm
appVersion: v1
replicaCount: 1

image:
  repository: ghcr.io/agntcy/coffee-agntcy/corto-farm
  tag: latest
  pullPolicy: Always
  pullSecret:

service:
  port: 9999

config:
  # FARM_AGENT_HOST: the host name clients should dial for the HTTP JSON-RPC endpoint, published in the agent card (for example the Service name). Empty means localhost, which only the pod itself can reach. The farm still binds all interfaces.
  farmAgentHost: ""
  farmAgentPort: ""
  azureApiBase: ""
  azureApiVersion: ""
  llmModel: ""
  transportServerEndpoint: ""
  defaultMessageTransport: ""
  slimServer: ""
  natsServer: ""
  otlpHttpEndpoint: ""
  slimSharedSecret: ""
  # SLIM_ALLOW_PLACEHOLDER_SECRET: true lets the SLIM interfaces start with the public app-sdk placeholder when no secret is set. Local demos only.
  slimAllowPlaceholderSecret: false
#  llmStreaming: False

# You can use your own config here for service account
serviceaccount:
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_ROLE_ARN


probes:
  livenessProbeEnabled: false
  readinessProbeEnabled: false
  port: 9999
  endpoint: /v1/health

resources:
  enabled: false
  limits:
    cpu: 2000m
    memory: 2500Mi
  requests:
    cpu: 200m
    memory: 500Mi
