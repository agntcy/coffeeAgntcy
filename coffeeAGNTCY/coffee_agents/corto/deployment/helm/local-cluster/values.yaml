opentelemetry-collector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.161.0
    digest: sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
  mode: deployment

clickhouse:
  auth:
    username: "admin"
    password: "admin"
  keeper:
    enabled: false
  shards: 1
  replicaCount: 1
  image:
    repository: bitnamilegacy/clickhouse
    tag: 25.7.5-debian-12-r0
    pullPolicy: IfNotPresent

slim:
  slim:
    image:
      # Chart v2.9.2 defaults to appVersion 3.4.6. Pinned here so a chart bump
      # cannot move the node; 3.4.6 is the version agntcy-app-sdk 0.7.0 is tested with.
      tag: "3.4.6"

corto-exchange:
  config:
    corsAllowedOrigins: "http://localhost:3000,http://127.0.0.1:3000"

corto-ui:
  environment: local
  configs:
    env:
      data:
        VITE_EXCHANGE_APP_API_URL: http://localhost:30080

# Populated by helmfile / config-overrides.yaml.gotmpl for local dev; defaults avoid nil when templating alone.
localExternalSecret:
  azureApiKey: ""
  slimSharedSecret: "slim-mls-secret-REPLACE_WITH_RANDOM_32PLUS_CHARS"
