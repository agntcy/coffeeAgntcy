[project]
name = "corto"
version = "0.1.0"
description = ""
authors = [{ name = "Shridhar Shah", email = "shridhsh@cisco.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "a2a-sdk==1.2.3",
    "click==8.4.1",
    "coloredlogs==15.0.1",
    "dotenv==0.9.9",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain-anthropic==1.7.1",
    "langchain-google-genai==4.2.0",
    "langchain-openai==1.6.2",
    "langchain-litellm==0.3.5",
    "langgraph==1.2.11",
    "langgraph-supervisor==0.0.31",
    "litellm==1.88.6",
    "pydantic==2.12.5",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "starlette==1.6.0",
    "uvicorn==0.33.0",
    "ioa-observe-sdk==1.1.0",
    "agntcy-app-sdk==0.7.0",
    "slim-bindings==3.3.9",
    "slima2a==0.9.3",
    "azure-core==1.38.0",
    # Vulnerability fix for requests
    "langchain-core==1.6.2",
    "urllib3==2.8.0",
    "aiohttp==3.14.4",
    "pyasn1==0.6.4",
    "pypdf==6.19.0",
    "filelock==4.2.1",
    "marshmallow==3.26.2",
    "PyNaCl==1.6.2",
    "mcp==1.30.0",
    "cryptography==50.0.1",
    "grpcio==1.85.1",
    "grpcio-tools==1.85.1",
    "protobuf==7.36.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==4.1.0",
    "typing-extensions==4.15.0",
    "openai==2.54.0",
    "coloredlogs==15.0.1",
    "langchain-openai==1.6.2",
    "sentence-transformers==5.7.0",
    "ruff==0.14.14",
]

[tool.uv]
exclude-newer = "14 days"
constraint-dependencies = [
    "torch>=2.13.0",
    "transformers>=5.10.0",
]
# spiffe==0.3.1 (latest) caps pyjwt[crypto]<2.14, which blocks several PyJWT
# CVE fixes (notably CVE-2026-102268, a critical asymmetric-key confusion
# bypass). Forced past that cap; see tests/unit/common/test_spiffe_jwt_compat.py
# for the compatibility contract this relies on.
override-dependencies = ["pyjwt[crypto]==2.15.1"]

[tool.uv.exclude-newer-package]
pyjwt = "2026-10-01T00:00:00Z"
# Deliberate early adoption of SLIM 3: agntcy-app-sdk 0.7.0 (uploaded
# 2026-11-10) requires slim-bindings 3.3.9 (2026-10-27), slima2a 0.9.3 and
# ioa-observe-sdk 1.1.0 (both 2026-10-22), a2a-sdk 1.2.3 (2026-10-19) and
# grpcio-tools>=1.85.1 (2026-10-30). Some are inside the 14-day window. Each
# date is a ceiling for that one package; later releases stay excluded until
# someone moves it.
agntcy-app-sdk = "2026-11-11T00:00:00Z"
slima2a = "2026-10-23T00:00:00Z"
slim-bindings = "2026-10-28T00:00:00Z"
ioa-observe-sdk = "2026-10-23T00:00:00Z"
grpcio = "2026-10-31T00:00:00Z"
grpcio-tools = "2026-10-31T00:00:00Z"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farm", "exchange"]

[tool.pytest.ini_options]
addopts = "--asyncio-mode=auto"
filterwarnings = ["error"]
markers = [
    "agents(names): marks tests that run for specific farms (e.g. @pytest.mark.farms([\"brazil\"]))",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
indent-width = 4
target-version = "py313"

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
# Indentation only (issue #747). Broader Ruff rules can land in a later PR.
# W191/E101 ban tabs and mixed indent; E111/E114/E117 enforce the 4-space width.
# E111/E114/E117 are preview-only, so preview is scoped to the linter here and
# does not affect `ruff format` output.
preview = true
select = ["W191", "E101", "E111", "E114", "E117"]
