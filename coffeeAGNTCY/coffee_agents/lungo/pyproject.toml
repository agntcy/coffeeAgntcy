[project]
name = "lungo"
version = "0.1.0"
description = ""
authors = [{ name = "Shridhar Shah", email = "shridhsh@cisco.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "a2a-sdk==0.3.20",
    "click==8.4.1",
    "coloredlogs==15.0.1",
    "dotenv==0.9.9",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "langchain-anthropic==1.7.1",
    "langchain-google-genai==4.2.3",
    "langchain-openai==0.3.34",
    "langgraph==1.2.11",
    "langgraph-supervisor==0.0.31",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "starlette==0.52.1",
    "uvicorn==0.48.0",
    "mcp[cli]==1.30.0",
    "ioa-observe-sdk==1.0.41",
    "agntcy-identity-service-sdk==0.0.7",
    "llama-index-llms-azure-openai==0.4.2",
    "langchain==1.4.0",
    "langchain-litellm==0.3.5",
    "llama-index-llms-litellm==0.6.3",
    "llama-index-core==0.14.9",
    "griffe==1.15.0",  # banks/llama-index import griffe 1.x API; 2.x is a meta-package without it
    "litellm==1.84.0",
    "google-adk==1.28.1",
    "slima2a==0.3.0",
    "slim-bindings==1.4.0",
    "agntcy-app-sdk==0.5.5",
    "azure-core==1.38.0",
    # Vulnerability fix for requests
    "langchain-core==1.6.2",
    "urllib3==2.7.0",
    "aiohttp==3.14.3",
    "pyasn1==0.6.4",
    "pypdf==6.18.0",
    "filelock==3.29.0",
    "marshmallow==3.26.2",
    "PyNaCl==1.6.2",
    "mcp==1.30.0",
    "cryptography==50.0.1",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.8",
    "pytest-cov==4.1.0",
    "typing-extensions==4.15.0",
    "openai==2.38.0",
    "coloredlogs==15.0.1",
    "langchain-openai==0.3.34",
    "sentence-transformers==5.5.1",
    "agntcy-dir==1.0.0",
    "openapi-spec-validator==0.9.0",
    "prance==25.4.8.0",
    "pyyaml==6.0.3",
    "ruff==0.14.14",
]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
url = "https://buf.build/gen/python"

[tool.uv]
exclude-newer = "14 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farm", "exchange", "schema", "api"]

[tool.pytest.ini_options]
addopts = "--asyncio-mode=auto"
filterwarnings = [
    "error",
]
markers = [
    "agents(names): marks tests that run for specific farms (e.g. @pytest.mark.farms([\"brazil\"]))",
    "no_pin_auction_shared: do not keep agents.supervisors.auction.graph.shared across this test",
    "open_meteo_stub(mode): set Open-Meteo stub mode (success|error) before weather-mcp subprocess starts",
    "use_weather_fallback(value): set USE_WEATHER_FALLBACK for colombia-farm subprocess (true|false)",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
indent-width = 4
target-version = "py313"

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
# Indentation only (issue #747). Broader Ruff rules can land in a later PR.
# W191/E101 ban tabs and mixed indent; E111/E114/E117 enforce the 4-space width.
# E111/E114/E117 are preview-only, so preview is scoped to the linter here and
# does not affect `ruff format` output.
preview = true
select = ["W191", "E101", "E111", "E114", "E117"]
