# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: recruiter
appVersion: v1
replicaCount: 1
environment:

image:
  repository: ghcr.io/agntcy/coffee-agntcy/recruiter
  tag: latest
  pullPolicy: Always
  pullSecret:



service:
  port: 8881

config:
  enableHttp: "true"
  mcpConnectionMode: "binary"
  directoryClientServerAddress: ""
  directoryClientTlsSkipVerify: "true"
  oasfApiValidationSchemaUrl: "https://schema.oasf.outshift.com"
  llmModel: ""
  azureApiBase: ""
  azureApiVersion: ""
  recruiterAgentUrl: "" # RECRUITER_AGENT_URL: the URL clients use to reach the recruiter, published in its agent card. Empty keeps the code default (http://localhost:8881), which only works from the pod itself
  discoveredAgentHost: "" # RECRUITER_DISCOVERED_AGENT_HOST: host used instead of 0.0.0.0 or localhost in the HTTP address of a discovered agent (port is kept). Empty keeps the code default (localhost), which inside the pod is the recruiter itself
  discoveredAgentAddresses: "" # RECRUITER_DISCOVERED_AGENT_ADDRESSES: comma-separated PORT=HOST[:PORT] pairs, the port of a discovered agent's record mapped to where the pod can reach it, e.g. "9998=colombia-farm:9999". Wins over discoveredAgentHost for the ports it lists. Empty means none
  otlpHttpEndpoint: ""

# You can use your own config here for service account
serviceaccount:
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_ROLE_ARN

probes:
  livenessProbeEnabled: false
  readinessProbeEnabled: false
  port: 8881
  endpoint: /.well-known/agent.json

resources:
  enabled: false
  limits:
    cpu: 2000m
    memory: 2500Mi
  requests:
    cpu: 200m
    memory: 500Mi
