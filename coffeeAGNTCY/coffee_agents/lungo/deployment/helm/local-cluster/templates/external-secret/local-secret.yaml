apiVersion: v1
kind: Secret
metadata:
  name: my-local-secret
  namespace: default
type: Opaque
stringData:
  AZURE_API_KEY: "{{ .Values.localExternalSecret.azureApiKey }}"
  # Shared by all SLIM client peers (consumed by ExternalSecret-backed charts as SLIM_SHARED_SECRET); the local SLIM server does not consume this value. Must be at least 32 characters.
  SLIM_SHARED_SECRET: "{{ .Values.localExternalSecret.slimSharedSecret }}"
