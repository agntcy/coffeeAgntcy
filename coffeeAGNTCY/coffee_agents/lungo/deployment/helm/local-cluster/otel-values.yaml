opentelemetry-collector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.161.0
    digest: sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1

  mode: deployment

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      batch: {}

    exporters:
      clickhouse:
        endpoint: "tcp://lungo-local-cluster-clickhouse:9000"
        database: "default"
        username: "admin"
        password: "admin"

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse]