apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-configmap
  namespace: {{ .Release.Namespace }}
data:
  CORS_ALLOWED_ORIGINS: "{{ .Values.config.corsAllowedOrigins }}"
  RECRUITER_AGENT_URL: "{{ .Values.config.recruiterAgentUrl }}"
  LLM_MODEL: "{{ .Values.config.llmModel }}"
  AZURE_API_BASE: "{{ .Values.config.azureApiBase }}"
  AZURE_API_VERSION: "{{ .Values.config.azureApiVersion }}"
  DEFAULT_MESSAGE_TRANSPORT: "{{ .Values.config.defaultMessageTransport }}"
  TRANSPORT_SERVER_ENDPOINT: "{{ .Values.config.transportServerEndpoint }}"
  SLIM_SERVER: "{{ .Values.config.slimServer }}"
  NATS_SERVER: "{{ .Values.config.natsServer }}"
  OTLP_HTTP_ENDPOINT: "{{ .Values.config.otlpHttpEndpoint }}"
  {{- if .Values.config.workflowApiUrl }}
  WORKFLOW_API_URL: {{ .Values.config.workflowApiUrl | quote }}
  {{- end }}
  {{- if .Values.config.workflowApiKey }}
  WORKFLOW_API_KEY: {{ .Values.config.workflowApiKey | quote }}
  {{- end }}
  IDENTITY_API_SERVER_URL: "{{ .Values.config.identityApiServerUrl }}"
  IDENTITY_API_KEY: "{{ .Values.config.identityApiKey }}"
  IDENTITY_AUTH_ENABLED: "{{ .Values.config.identityAuthEnabled }}"
  IDENTITY_SERVICE_API_KEY: "{{ .Values.config.identityServiceApiKey }}"
