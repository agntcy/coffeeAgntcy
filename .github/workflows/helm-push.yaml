name: Helm Push Charts

on:
  push:
    tags: ["*"]
    branches:
      - main
    paths:
      - 'coffeeAGNTCY/coffee_agents/*/deployment/helm/**'
  pull_request:
    paths:
      - 'coffeeAGNTCY/coffee_agents/*/deployment/helm/**'
      - '.github/workflows/helm-push.yaml'
      - '.github/workflows/helm-package-reusable.yaml'
      - '.github/actions/check-paths-have-changes/**'
  workflow_dispatch:
    inputs:
      push:
        description: 'Whether to push the charts to the registry.'
        required: false
        type: boolean
        default: false
      build_corto:
        description: 'Whether to build the corto chart.'
        required: false
        type: boolean
        default: true
      build_lungo:
        description: 'Whether to build the lungo chart.'
        required: false
        type: boolean
        default: true

env:
  CORTO_DIR: coffeeAGNTCY/coffee_agents/corto
  LUNGO_DIR: coffeeAGNTCY/coffee_agents/lungo
  HELM_SUBDIR: deployment/helm
  # Single source of truth for the chart list, shared by the matrices below and by
  # the change-detection and version-guard logic in subprojects-to-build /
  # check-push-target-existence.
  CORTO_CHARTS_JSON: >-
    [
      {"package_name": "corto-ui", "path": "coffeeAGNTCY/coffee_agents/corto/deployment/helm/corto-ui"},
      {"package_name": "corto-exchange", "path": "coffeeAGNTCY/coffee_agents/corto/deployment/helm/exchange"},
      {"package_name": "corto-farm", "path": "coffeeAGNTCY/coffee_agents/corto/deployment/helm/farm"}
    ]
  LUNGO_CHARTS_JSON: >-
    [
      {"package_name": "lungo-ui", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/ui"},
      {"package_name": "auction-supervisor", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/auction-supervisor"},
      {"package_name": "agentic-workflows-api", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/agentic-workflows-api"},
      {"package_name": "brazil-farm", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/brazil-farm"},
      {"package_name": "colombia-farm", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/colombia-farm"},
      {"package_name": "vietnam-farm", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/vietnam-farm"},
      {"package_name": "weather-mcp-server", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/weather-mcp-server"},
      {"package_name": "payment-mcp-server", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/payment-mcp-server"},
      {"package_name": "logistics-supervisor", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/logistics-supervisor"},
      {"package_name": "logistics-shipper", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/logistics-shipper"},
      {"package_name": "logistics-accountant", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/logistics-accountant"},
      {"package_name": "logistics-farm", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/logistics-farm"},
      {"package_name": "logistics-helpdesk", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/logistics-helpdesk"},
      {"package_name": "recruiter", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/recruiter"},
      {"package_name": "recruiter-supervisor", "path": "coffeeAGNTCY/coffee_agents/lungo/deployment/helm/recruiter-supervisor"}
    ]

permissions: read-all

jobs:
  subprojects-to-build:
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.choose-subprojects.outputs.push }}
      build_corto: ${{ steps.choose-subprojects.outputs.build_corto }}
      build_lungo: ${{ steps.choose-subprojects.outputs.build_lungo }}
      corto_charts: ${{ steps.choose-subprojects.outputs.corto_charts }}
      lungo_charts: ${{ steps.choose-subprojects.outputs.lungo_charts }}
    defaults:
      run:
        shell: bash
    env:
      WORKFLOW_FILES_LIST_JSON: '[".github/workflows/helm-push.yaml", ".github/workflows/helm-package-reusable.yaml", ".github/actions/check-paths-have-changes"]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Log event info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"

      - name: Log dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "push=${{ inputs.push }}"
          echo "build_corto=${{ inputs.build_corto }}"
          echo "build_lungo=${{ inputs.build_lungo }}"

      - name: Prepare subproject paths JSON lists
        if: ${{ github.event_name == 'pull_request' }}
        id: prepare-path-lists
        run: |
          paths_json_corto=$(echo "$WORKFLOW_FILES_LIST_JSON" | jq -c -r --arg new_val "$CORTO_DIR/$HELM_SUBDIR" '[$new_val] + .')
          echo "paths_json_corto=$paths_json_corto" | tee -a "$GITHUB_OUTPUT"

          paths_json_lungo=$(echo "$WORKFLOW_FILES_LIST_JSON" | jq -c -r --arg new_val "$LUNGO_DIR/$HELM_SUBDIR" '[$new_val] + .')
          echo "paths_json_lungo=$paths_json_lungo" | tee -a "$GITHUB_OUTPUT"

      - name: Check paths have changes for Corto
        if: ${{ github.event_name == 'pull_request' }}
        id: check-paths-corto
        uses: ./.github/actions/check-paths-have-changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          paths_json_list: ${{ steps.prepare-path-lists.outputs.paths_json_corto }}

      - name: Check paths have changes for Lungo
        if: ${{ github.event_name == 'pull_request' }}
        id: check-paths-lungo
        uses: ./.github/actions/check-paths-have-changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          paths_json_list: ${{ steps.prepare-path-lists.outputs.paths_json_lungo }}

      - name: Determine build choices for subprojects
        id: choose-subprojects
        run: |
          build_corto=false
          build_lungo=false

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              push=true
            else
              push=false
            fi

            build_corto=true
            build_lungo=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            push=${{ inputs.push }}
            build_corto=${{ inputs.build_corto }}
            build_lungo=${{ inputs.build_lungo }}
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            push=false
            build_corto=${{ steps.check-paths-corto.outputs.changed }}
            build_lungo=${{ steps.check-paths-lungo.outputs.changed }}
          fi

          echo "push=$push" | tee -a "$GITHUB_OUTPUT"
          echo "build_corto=$build_corto" | tee -a "$GITHUB_OUTPUT"
          echo "build_lungo=$build_lungo" | tee -a "$GITHUB_OUTPUT"

          # Repackaging a chart with no content change still produces a different
          # tgz (embedded timestamps), which would silently overwrite the existing,
          # supposedly-immutable version. So on a push to main, drop charts with no
          # actual diff from the matrix before packaging even starts. Other events
          # never push (see above), so there is no overpush risk to guard there and
          # the full chart list is kept as-is.
          only_changed() {
            local charts_json="$1"
            if [[ "$push" != "true" ]]; then
              jq -c '.' <<< "$charts_json"
              return
            fi

            jq -c '.[]' <<< "$charts_json" | while IFS= read -r chart; do
              path=$(jq -r '.path' <<< "$chart")
              if ! git diff --name-only --exit-code "${{ github.event.before }}" "${{ github.sha }}" -- "${path}/" > /dev/null; then
                echo "$chart"
              fi
            done | jq -c -s '.'
          }

          echo "corto_charts=$(only_changed "$CORTO_CHARTS_JSON")" | tee -a "$GITHUB_OUTPUT"
          echo "lungo_charts=$(only_changed "$LUNGO_CHARTS_JSON")" | tee -a "$GITHUB_OUTPUT"

  check-push-target-existence:
    needs: [subprojects-to-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Helm integrity
        run: |
          push=${{ needs.subprojects-to-build.outputs.push }}
          build_corto=${{ needs.subprojects-to-build.outputs.build_corto }}
          build_lungo=${{ needs.subprojects-to-build.outputs.build_lungo }}
          corto_charts='${{ needs.subprojects-to-build.outputs.corto_charts }}'
          lungo_charts='${{ needs.subprojects-to-build.outputs.lungo_charts }}'

          existing_charts=()
          for project in corto lungo; do
            build=build_$project
            charts_var=${project}_charts

            if [[ "${!build}" == "true" ]] && [[ "${push}" == "true" ]]; then
              # Note: corto_charts/lungo_charts are already filtered to changed
              # charts only when push is true, so every entry here is checked.
              while IFS= read -r chart; do
                package_name=$(jq -r '.package_name' <<< "$chart")
                chart_directory=$(jq -r '.path' <<< "$chart")
                chart_path="coffee_agntcy%2Fhelm%2F${package_name}"

                chart_version=$(grep '^version:' "${chart_directory}/Chart.yaml" | awk '{print $2}')

                version_id=$(gh api "/orgs/agntcy/packages/container/${chart_path}/versions" \
                  --jq '.[] | select(.metadata.container.tags[]? == "'${chart_version}'") | .id' \
                  | head -n1)

                if [[ -n "${version_id}" ]]; then
                  existing_charts+=("ghcr.io/agntcy/${chart_path}:${chart_version}")
                fi
              done < <(jq -c '.[]' <<< "${!charts_var}")
            fi
          done

          if [[ "${#existing_charts[@]}" -gt 0 ]]; then
            echo "Error: The following chart versions already exist:"
            for chart in "${existing_charts[@]}"; do
              echo "- $chart"
            done
            echo "Cancelling package and push. Change the version or use the 'Delete GHCR Package Version' workflow to delete the existing chart versions before retrying."

            exit 1
          fi

  helm-package-corto:
    needs: [subprojects-to-build, check-push-target-existence]
    if: ${{ needs.subprojects-to-build.outputs.build_corto == 'true' && needs.subprojects-to-build.outputs.corto_charts != '[]' }}

    strategy:
      matrix:
        chart: ${{ fromJson(needs.subprojects-to-build.outputs.corto_charts) }}

    permissions: # permissions can only be maintained or reduced (not elevated) throughout a chain of workflows
      packages: write
      contents: read

    uses: ./.github/workflows/helm-package-reusable.yaml
    with:
      path: ${{ matrix.chart.path }}
      package_name: ${{ matrix.chart.package_name }}
      push: ${{ github.event_name == 'push' || ( github.event_name == 'workflow_dispatch' && inputs.push ) }}


  helm-package-lungo:
    needs: [subprojects-to-build, check-push-target-existence]
    if: ${{ needs.subprojects-to-build.outputs.build_lungo == 'true' && needs.subprojects-to-build.outputs.lungo_charts != '[]' }}

    strategy:
      matrix:
        chart: ${{ fromJson(needs.subprojects-to-build.outputs.lungo_charts) }}

    permissions: # permissions can only be maintained or reduced (not elevated) throughout a chain of workflows
      packages: write
      contents: read

    uses: ./.github/workflows/helm-package-reusable.yaml
    with:
      path: ${{ matrix.chart.path }}
      package_name: ${{ matrix.chart.package_name }}
      push: ${{ github.event_name == 'push' || ( github.event_name == 'workflow_dispatch' && inputs.push )}}
