name: Source lint

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

permissions: read-all

jobs:
    forbidden-strings:
        name: Forbidden strings
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Check for forbidden strings
              uses: ./.github/actions/check-forbidden-strings
              with:
                  strings_json: '[
                      "\u2013",
                      "\u2014"
                      ]' # Note: en dash (U+2013), em dash (U+2014).
                  error_message: "Forbidden string found."

    helm-chart-versions:
        name: Helm chart version bumps
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup Task
              uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
              with:
                  version: "3.53.1"

            - name: Check Helm chart version bumps
              run: |
                  LAST_RELEASE_TAG=$(git tag --list --sort=-creatordate | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
                  echo "Comparing against last release tag: ${LAST_RELEASE_TAG}"
                  task helm:check-versions -- "${LAST_RELEASE_TAG}"
