name: Helm Package and Push Single Chart

on:
  workflow_call:
    inputs:
      path:
        description: 'The path to the chart directory.'
        required: true
        type: string
      package_name:
        description: 'The package name to use for the chart.'
        required: true
        type: string
      push:
        description: 'Whether to push the chart to the registry.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  helm-package-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Log inputs
        run: |
          echo "path=${{ inputs.path }}"
          echo "package_name=${{ inputs.package_name }}"
          echo "push=${{ inputs.push }}"

      - name: Pre-cleanup Docker images
        run: docker system prune -af

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Log in to GitHub Container Registry
        if: inputs.push == true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "4.3.1"

      - name: Helm lint
        # The --strict flag promotes lint warnings to failures.
        run: helm lint ${{ inputs.path }} --with-subcharts --strict

      - name: Helm template (render check)
        # Fully render the chart to catch templating issues (nil dereferences,
        # bad function calls, invalid rendered YAML) that `helm lint` alone
        # does not surface.
        run: helm template lint-check ${{ inputs.path }} > /dev/null

      - name: Package Helm Chart
        id: package
        run: |
          CHART_VERSION=$(grep '^version:' ${{ inputs.path }}/Chart.yaml | awk '{print $2}')
          helm package ${{ inputs.path }} --dependency-update --version "$CHART_VERSION"
          echo "chart_version=$CHART_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Push Helm Chart
        if: inputs.push == true
        run: |
          helm push ${{ inputs.package_name }}-${{ steps.package.outputs.chart_version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/coffee_agntcy/helm
