name: CI Gate

# Single required status check for the repo - a pure collector with no
# check logic of its own (see .agents/rules/repo-operation-pipeline.md and
# the ci-gate spec capability). The actual checks run in checks.yaml
# (task check:all), whose triggers are kept identical to this workflow's
# own so it is always among the sibling runs collected below. The
# Wait/Summarize logic lives in scripts/ci-gate/ - see
# scripts/ci-gate/wait-for-sibling-runs.sh and
# scripts/ci-gate/summarize-ci-gate.sh for the full behavior. Both scripts
# need only bash/jq/gh, all already on a GitHub-hosted runner, so this
# workflow never bootstraps this repo's pinned toolchain.
#
# - Waits for every sibling workflow run triggered on the same commit to reach
#   a terminal state, by polling the Actions runs API (not the checks API -
#   that one silently omits startup_failure runs), then reports on all of them,
#   including ones that failed at startup, were skipped, or never completed.
#   Never waits on a run of CI Gate itself (filtered by workflow_id, not just
#   run id), so two CI Gate runs sharing a commit (e.g. a non-squash merge)
#   never deadlock waiting on each other.
# - The summarize step always runs regardless of the wait step's outcome, and
#   the pass/fail decision is made once every sibling run has been collected.

on:
  pull_request: {}
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  SETTLE_DELAY_SECONDS: 60
  POLL_INTERVAL_SECONDS: 60
  OVERALL_TIMEOUT_SECONDS: 6000 # 100 minutes
  CONSECUTIVE_CLEAN_POLLS_REQUIRED: 2

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Wait for sibling workflow runs on this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            export HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            export HEAD_SHA="${{ github.sha }}"
          fi

          ./scripts/ci-gate/wait-for-sibling-runs.sh

      - name: Summarize and decide
        if: always()
        env:
          SETTLED: ${{ steps.wait.outputs.settled }}
        run: ./scripts/ci-gate/summarize-ci-gate.sh
