name: CI Gate

# Single required status check for the repo. The Wait/Summarize logic lives
# in scripts/ci-gate/ (wired through the Taskfile) rather than inline here,
# following .agents/rules/repo-operation-pipeline.md like every other check
# in this repo - see scripts/ci-gate/wait-for-sibling-runs.sh and
# scripts/ci-gate/summarize-ci-gate.sh for the full behavior.
#
# - Validates every workflow file under .github/workflows/ (schema, syntax,
#   structure) via actionlint, on every run - no manual list to keep in sync.
# - Waits for every sibling workflow run triggered on the same commit to reach
#   a terminal state, by polling the Actions runs API (not the checks API -
#   that one silently omits startup_failure runs), then reports on all of them,
#   including ones that failed at startup, were skipped, or never completed.
#   Never waits on a run of CI Gate itself (filtered by workflow_id, not just
#   run id), so two CI Gate runs sharing a commit (e.g. a non-squash merge)
#   never deadlock waiting on each other.
# - Never short-circuits: validation and the wait/report step both run
#   regardless of each other's outcome, and the pass/fail decision is made
#   once everything has been collected.

on:
  pull_request: {}
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  SETTLE_DELAY_SECONDS: 60
  POLL_INTERVAL_SECONDS: 60
  OVERALL_TIMEOUT_SECONDS: 6000 # 100 minutes
  CONSECUTIVE_CLEAN_POLLS_REQUIRED: 2

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Bootstrap repo-local tooling
        run: ./scripts/setup.sh

      - name: Validate all workflow files (schema, syntax, structure)
        id: validate
        continue-on-error: true
        run: |
          source scripts/env.sh
          task workflows:lint

      - name: Wait for sibling workflow runs on this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            export HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            export HEAD_SHA="${{ github.sha }}"
          fi

          source scripts/env.sh
          task ci-gate:wait

      - name: Summarize and decide
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          SETTLED: ${{ steps.wait.outputs.settled }}
        run: |
          source scripts/env.sh
          task ci-gate:summarize
