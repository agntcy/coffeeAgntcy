# Frontend CI: typecheck, ESLint, and Prettier for Lungo frontend when files there change.
# CD (deploy to dev/staging) would be a separate workflow. IDE: see TUTORIAL.md § IDE setup for CI (lint/format).
name: FE CI

on:
  pull_request:
    branches: [main]
    paths:
      - "coffeeAGNTCY/coffee_agents/lungo/frontend/**"
      - "coffeeAGNTCY/coffee_agents/lungo/schema/openapi/**"
      - "coffeeAGNTCY/coffee_agents/lungo/schema/jsonschemas/event_v1.json"
  push:
    branches: [main]
    paths:
      - "coffeeAGNTCY/coffee_agents/lungo/frontend/**"
      - "coffeeAGNTCY/coffee_agents/lungo/schema/openapi/**"
      - "coffeeAGNTCY/coffee_agents/lungo/schema/jsonschemas/event_v1.json"

permissions: read-all

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coffeeAGNTCY/coffee_agents/lungo/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: coffeeAGNTCY/coffee_agents/lungo/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify OpenAPI generated types
        run: npm run check:api-types

      - name: Run frontend checks
        run: npm run check
