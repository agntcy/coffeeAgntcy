# Python lint: Ruff static analysis for the backend packages.
#
# Tests live in test.yaml / test-reusable.yaml; this workflow is lint only and
# never formats or rewrites files. Ruff is run standalone (uvx), so no project
# dependencies are installed - the version comes from each package's uv.lock so
# CI and local `uv run ruff check .` use the same Ruff.
name: Python lint

on:
  pull_request:
    branches: [main]
    paths:
      - "coffeeAGNTCY/coffee_agents/**/*.py"
      - "coffeeAGNTCY/coffee_agents/**/pyproject.toml"
      - "coffeeAGNTCY/coffee_agents/**/uv.lock"
      - ".github/workflows/python-lint.yaml"
  push:
    branches: [main]
    paths:
      - "coffeeAGNTCY/coffee_agents/**/*.py"
      - "coffeeAGNTCY/coffee_agents/**/pyproject.toml"
      - "coffeeAGNTCY/coffee_agents/**/uv.lock"
      - ".github/workflows/python-lint.yaml"
  workflow_dispatch:

permissions: read-all

jobs:
  ruff:
    name: ruff / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [corto, lungo, recruiter]
    defaults:
      run:
        working-directory: coffeeAGNTCY/coffee_agents/${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Resolve pinned Ruff version
        id: ruff
        run: |
          version=$(python3 -c 'import tomllib; lock = tomllib.load(open("uv.lock", "rb")); print(next(p["version"] for p in lock["package"] if p["name"] == "ruff"))')
          echo "Using Ruff $version (pinned by uv.lock)"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Run Ruff
        run: uvx ruff@${{ steps.ruff.outputs.version }} check .
