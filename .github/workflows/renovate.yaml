name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate Sync
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with GitHub App Bot
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}
          # Make sure the value of GITHUB_TOKEN will not be persisted in repo's config
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: "**/*.sum"

      # TODO: Move uv setup to setup.sh
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Bootstrap repo-local tooling
        run: ./scripts/setup.sh

      - name: Run Renovate
        run: |
          source scripts/env.sh
          task renovate:sync
        env:
          ## Discovery
          RENOVATE_AUTODISCOVER: "true"
          RENOVATE_AUTODISCOVER_FILTER: "${{ github.repository }}"
          ## Post-upgrade tasks: allow exactly the checksum and lockfile
          ## regeneration (see postUpgradeTasks in renovate.json), nothing else.
          RENOVATE_ALLOWED_COMMANDS: '["^scripts/tools/update_(checksums|npm_lock)\\.bash$"]'
          ## Project sync
          RENOVATE_PLATFORM_COMMIT: "enabled"
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
